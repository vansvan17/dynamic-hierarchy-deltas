name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Unit and cross-check tests
        run: ctest --test-dir build --output-on-failure
      - name: Exhaustive four-node check
        run: ./build/delta_exhaustive 4
